{% extends "base.html" %}
{% block title %}{{ code }} – Error{% endblock %}
{% block topbar_title %}Error{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;">
  <div style="font-size:80px;font-weight:900;color:#e5e7eb;line-height:1;">{{ code }}</div>
  <div style="font-size:24px;font-weight:800;color:var(--primary);margin-top:8px;">{{ message }}</div>
  <div style="color:var(--text-muted);margin-top:8px;max-width:400px;">{{ detail }}</div>
  <div style="margin-top:24px;display:flex;gap:12px;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Go to Dashboard</a>
    <a href="javascript:history.back()" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
  </div>
</div>
{% endblock %}
