{% extends "base.html" %}
{% block title %}Add Department Admin{% endblock %}
{% block topbar_title %}Add Department Admin{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>Add Department Admin</h1><div class="breadcrumb"><a href="{{ url_for('dashboard') }}">Dashboard</a> › <a href="{{ url_for('list_admins') }}">Admins</a> › Add</div></div>
</div>
<div class="card" style="max-width:600px;">
  <div class="card-header"><h3><i class="fa-solid fa-user-shield"></i> New Admin Details</h3></div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" name="name" placeholder="Dr. John Smith" required/>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input class="form-control" name="username" placeholder="jsmith_ict" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" name="password" placeholder="Strong password" required/>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Faculty</label>
          <select class="form-control" name="faculty_code" id="faculty_sel" onchange="updateDepts()" required>
            <option value="">-- Select Faculty --</option>
            {% for fcode, finfo in bup.items() %}
            <option value="{{ fcode }}">{{ fcode }} – {{ finfo.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select class="form-control" name="dept_code" id="dept_sel" required>
            <option value="">-- Select Faculty First --</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:12px;">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Create Admin</button>
        <a href="{{ url_for('list_admins') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
const bup = {{ bup|tojson }};
function updateDepts(){
  const fac = document.getElementById('faculty_sel').value;
  const ds = document.getElementById('dept_sel');
  ds.innerHTML = '<option value="">-- Select Department --</option>';
  if(fac && bup[fac]){
    Object.entries(bup[fac].departments).forEach(([code,info])=>{
      const opt = document.createElement('option');
      opt.value = code; opt.textContent = code+' – '+info.name;
      ds.appendChild(opt);
    });
  }
}
</script>
{% endblock %}
